name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export BRANCH="main"
            export WEB_SERVICE_NAME="${{ secrets.WEB_SERVICE_NAME }}"
            export ENGINE_SERVICE_NAME="${{ secrets.ENGINE_SERVICE_NAME }}"
            export APP_DIR="${APP_DIR:-/home/ec2-user/CopyCat}"
            export WEB_SERVICE_NAME="${WEB_SERVICE_NAME:-copycat-web}"
            export ENGINE_SERVICE_NAME="${ENGINE_SERVICE_NAME:-copycat-engine}"
            cd "$APP_DIR"
            bash deploy/deploy_on_ec2.sh
            sleep 2
            sudo systemctl is-active --quiet "$WEB_SERVICE_NAME"
            sudo systemctl is-active --quiet "$ENGINE_SERVICE_NAME"
            curl -fsS http://127.0.0.1:8060/healthz > /tmp/copycat-health.json
            echo "== systemctl status: $WEB_SERVICE_NAME =="
            sudo systemctl --no-pager --full status "$WEB_SERVICE_NAME" | sed -n '1,40p'
            echo "== systemctl status: $ENGINE_SERVICE_NAME =="
            sudo systemctl --no-pager --full status "$ENGINE_SERVICE_NAME" | sed -n '1,40p'
            echo "== engine journal tail =="
            sudo journalctl -u "$ENGINE_SERVICE_NAME" -n 80 --no-pager
            echo "== localhost healthz =="
            cat /tmp/copycat-health.json
