name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export BRANCH="main"
            cd "${APP_DIR:-/home/ec2-user/CopyCat}"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            sudo systemctl stop copycat copycat-engine || true
            pkill -9 -f gunicorn || true
            sleep 2
            sudo systemctl start copycat copycat-engine
            sleep 2
            sudo systemctl is-active --quiet copycat
            sudo systemctl is-active --quiet copycat-engine
            curl -fsS http://127.0.0.1:8060/healthz > /tmp/copycat-health.json
