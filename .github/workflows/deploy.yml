name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export BRANCH="main"
            cd "${APP_DIR:-/home/ec2-user/CopyCat}"
            bash deploy/deploy_on_ec2.sh
